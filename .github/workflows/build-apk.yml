name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release RepeatSpeaker.apk (v1.1.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Generate Clean Android Platform & Gradle Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example
          chmod +x android/gradlew
          python3 .github/scripts/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release File
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RepeatSpeaker.apk
          ls -lh RepeatSpeaker.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepeatSpeaker-APK
          path: RepeatSpeaker.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RepeatSpeaker.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          name: 'Repeat Speaker v1.1.0 – Liquid Glass & Word Highlighting Edition'
          body: |
            ## Repeat Speaker v1.1.0 (Build 2) 🎙️✨

            ### What's New in this Release:
            - 💎 **Apple iOS Liquid Glass UI:** Translucent frosted glass surfaces, glowing ambient depth, refined shadows, and buttery-smooth animations.
            - 📖 **Real-Time Word Highlighting:** Synchronized word-by-word highlighting during text-to-speech loop playback.
            - 🎙️ **5 Curated Voice Models:** Filtered to 5 natural, clear, studio-grade voices (US Studio, US Clarity, British Elegance, British Warmth, Australian Crisp).
            - 💾 **Persistent Data & Settings:** Automatic retention of entered text, selected voice, playback speed, pause interval, and theme across app closures.
            - ⏯️ **Circular Media Controls:** Large floating circular Play/Pause button with pulse halo, secondary Stop and Counter Reset controls.

            ### Direct APK Download
            - **[Download RepeatSpeaker.apk](https://github.com/${{ github.repository }}/releases/download/v1.1.0/RepeatSpeaker.apk)**

            ### Installation Instructions
            1. Download `RepeatSpeaker.apk` directly to your Android device.
            2. Tap the downloaded APK in your notification bar or Files/Downloads folder.
            3. If prompted, toggle on **"Allow from this source"**.
            4. Tap **Install** (or **Update**) and launch the app!
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
