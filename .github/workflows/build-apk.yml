name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release RepeatSpeaker.apk (v1.2.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Generate Clean Android Platform & Gradle Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example
          chmod +x android/gradlew
          python3 .github/scripts/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release File
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RepeatSpeaker.apk
          ls -lh RepeatSpeaker.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepeatSpeaker-APK
          path: RepeatSpeaker.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RepeatSpeaker.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.0' }}
          name: 'Repeat Speaker v1.2.0 – Fast & Minimal Edition'
          body: |
            ## Repeat Speaker v1.2.0 (Build 3) ⚡🎙️

            ### What's New in this Release:
            - ⚡ **Zero-Lag Performance:** Completely removed heavy GPU blur operations and continuous background animation loops for butter-smooth 60–120fps responsiveness on Android.
            - 🎯 **Single Play/Pause Button:** Replaced multiple playback buttons with a single, clean, prominent circular Play/Pause button.
            - ✨ **Clean & Minimal Theme:** Removed excessive neon glow shadows and ambient orbs in favor of a sleek, minimalist Apple-style dark/light interface.
            - 🎨 **Minimal App Logo:** Simplified brand logo to a crisp, professional icon.
            - 📋 **Silent One-Tap Paste:** Removed the bottom "Pasted from clipboard" popup toast on paste.
            - 📖 **Synchronized Word Highlighting:** Real-time word-by-word visual highlight during speech.
            - 🎙️ **5 Curated Voices:** 5 natural, clear studio-grade voice models.
            - 💾 **Persistent Data:** Automatic retention of text, voice, speed, and pause settings.

            ### Direct APK Download
            - **[Download RepeatSpeaker.apk](https://github.com/${{ github.repository }}/releases/download/v1.2.0/RepeatSpeaker.apk)**

            ### Installation Instructions
            1. Download `RepeatSpeaker.apk` directly to your Android phone.
            2. Tap the downloaded APK in your notification bar or Downloads folder.
            3. Tap **Install** (or **Update**) and launch!
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
