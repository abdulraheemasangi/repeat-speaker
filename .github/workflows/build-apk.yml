name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release RepeatSpeaker.apk (v1.6.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Generate Clean Android Platform & Gradle Wrapper
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example
          chmod +x android/gradlew
          python3 .github/scripts/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release File
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RepeatSpeaker.apk
          ls -lh RepeatSpeaker.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepeatSpeaker-APK
          path: RepeatSpeaker.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RepeatSpeaker.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.6.0' }}
          name: 'Repeat Speaker v1.6.0 – Restored Original Vector Icons & Lighter Aesthetic'
          body: |
            ## Repeat Speaker v1.6.0 (Build 7)

            ### What's New in this Release:
            - **Restored Original Material Vector Icons:** Restored all familiar, crisp, rounded vector icons (`Icons.*_rounded`) across the entire app (AppBar, Cards, Repeat Chips, Media Controls, and Voice Selector).
            - **Lighter Aesthetic for Buttons & Surfaces:** Clean, soft, luminous background and lighter glass buttons for a fresh, elegant look.
            - **Restored Clean Horizontal Repeat Limit Pills:** Restored the favorite sleek horizontal chip selector with crisp vector icons (Endless, 1x, 3x, 5x, 10x, 20x, 50x) with zero emojis.
            - **Fixed Voice Preview & Background Collision:** Opening Voice Models or listening to voice samples automatically pauses background playback with zero audio overlap.
            - **Eliminated Rapid Runaway Counter Bug:** Aborted-utterance timing safeguard prevents counter inflation on interrupted speech.
            - **Single-Trigger CI Workflow:** Optimized CI release trigger to run once on release tags.

            ### Direct APK Download
            - **[Download RepeatSpeaker.apk](https://github.com/${{ github.repository }}/releases/download/v1.6.0/RepeatSpeaker.apk)**

            ### Installation Instructions
            1. Download `RepeatSpeaker.apk` directly to your Android phone.
            2. Tap the downloaded APK in your notification bar or Downloads folder.
            3. Tap **Install** (or **Update**) and launch!
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
