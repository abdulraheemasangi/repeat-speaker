name: repeat_speaker
description: "Repeat Speaker - A clean, minimal mobile app that speaks text aloud on an endless loop."
publish_to: "none"
version: 1.6.0+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.2
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
